<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Function Call Analyzer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    label { display: block; margin-top: 1rem; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
    #results { margin-top: 1.5rem; }
    .func { margin-top: 1.2rem; }
    .calldata { display: flex; flex-direction: row-reverse; margin-block-end: 2rem; }
    .calls, .calledby { margin-left: 1.5rem; color: #444; margin-block:.5em;  flex: 0 0 45%;	/* no grow, no shrink, fixed 40% width */
	box-sizing: border-box; }
    code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 3px; }
    em { font-style: normal; color: tan; }
    .file { font-style: italic; color: tan; font-size: 80%; margin-inline-start: 2rem; }
    .htmlfunction { margin-block: .5rem; }
    .htmlfunction em { font-size: 90%; margin-inline-start: 2rem; }
  </style>
</head>
<body>
<h1>JS Function Call Analyzer</h1>

<label for="fileInput">Choose a .js or .html file (optional):</label>
<input type="file" id="fileInput" accept=".js,.html,.htm">

<label for="textInput">Or paste JavaScript or HTML here:</label>
<textarea id="textInput" placeholder="Paste JavaScript code or HTML containing &lt;script&gt; tags here..."></textarea>

<button id="analyzeBtn">Analyze</button>


<div id="results"></div>


<script>
const fileInput = document.getElementById('fileInput')
const textInput = document.getElementById('textInput')
const analyzeBtn = document.getElementById('analyzeBtn')
const resultsDiv = document.getElementById('results')

const functionOrigins = {}

analyzeBtn.addEventListener('click', () => {
  const pasted = textInput.value.trim()

  if (pasted) {
    recordFunctionOrigins(pasted, "(pasted input)")
    analyzeText(pasted)
    return
  }

  const file = fileInput.files[0]
  if (!file) {
    resultsDiv.innerHTML = "<p>Please paste code or choose a file.</p>"
    return
  }

  const reader = new FileReader()
  reader.onload = () => handleFile(file.name, reader.result)
  reader.readAsText(file)
})

async function handleFile(filename, text) {
  if (filename.endsWith(".html") || filename.endsWith(".htm")) {
    const combined = await extractScriptsFromHTML(text, filename)
    if (!combined.trim()) {
      resultsDiv.innerHTML = "<p>No &lt;script&gt; content found in HTML file.</p>"
      return
    }
    analyzeText(combined)
  } else {
    recordFunctionOrigins(text, filename)
    analyzeText(text)
  }
}

function recordFunctionOrigins(text, filename) {
  const regex = new RegExp("function\\s+([A-Za-z_$][0-9A-Za-z_$]*)\\s*\\(", "g")
  let match
  while ((match = regex.exec(text)) !== null) {
    const fn = match[1]
    if (!functionOrigins[fn]) functionOrigins[fn] = new Set()
    functionOrigins[fn].add(filename)
  }
}

async function extractScriptsFromHTML(html, htmlFilename) {
  const parser = new DOMParser()
  const doc = parser.parseFromString(html, "text/html")
  const scripts = [...doc.querySelectorAll("script")]

  let combined = ""

  for (const s of scripts) {
    if (s.textContent && s.textContent.trim()) {
      const js = s.textContent
      recordFunctionOrigins(js, htmlFilename)
      combined += "\n\n" + js
      continue
    }

    const src = s.getAttribute("src")
    if (src) {
      try {
        const absoluteURL = new URL(src, location.href).href
        const response = await fetch(absoluteURL)
        const js = await response.text()

        const path = new URL(src, location.href).pathname
        const jsName = path.split("/").pop() || src

        recordFunctionOrigins(js, jsName)
        combined += "\n\n" + js
      } catch (err) {
        combined += `\n\n// Failed to load external script: ${src}\n`
      }
    }
  }

  return combined
}

function extractFunctionNames(text) {
  const regex = new RegExp("function\\s+([A-Za-z_$][0-9A-Za-z_$]*)\\s*\\(", "g")
  const names = new Set()
  let match
  while ((match = regex.exec(text)) !== null) names.add(match[1])
  return [...names]
}

function stripComments(code) {
  return code
    .replace(/\/\/[^\n]*/g, "")
    .replace(/\/\*[\s\S]*?\*\//g, "")
}

function extractFunctionBody(text, startIndex) {
  let i = startIndex
  let depth = 1

  let inSingle = false
  let inDouble = false
  let inTemplate = false
  let inRegex = false
  let inLineComment = false
  let inBlockComment = false

  while (i < text.length && depth > 0) {
    const ch = text[i]
    const next = text[i + 1]

    if (!inSingle && !inDouble && !inTemplate && !inRegex && !inBlockComment && ch === "/" && next === "/") {
      inLineComment = true
      i += 2
      continue
    }
    if (inLineComment) {
      if (ch === "\n") inLineComment = false
      i++
      continue
    }

    if (!inSingle && !inDouble && !inTemplate && !inRegex && !inLineComment && ch === "/" && next === "*") {
      inBlockComment = true
      i += 2
      continue
    }
    if (inBlockComment) {
      if (ch === "*" && next === "/") {
        inBlockComment = false
        i += 2
      } else i++
      continue
    }

    if ((inSingle || inDouble || inTemplate || inRegex) && ch === "\\") {
      i += 2
      continue
    }

    if (!inSingle && !inDouble && !inRegex && ch === "`") {
      inTemplate = !inTemplate
      i++
      continue
    }

    if (!inDouble && !inTemplate && !inRegex && ch === "'") {
      inSingle = !inSingle
      i++
      continue
    }

    if (!inSingle && !inTemplate && !inRegex && ch === '"') {
      inDouble = !inDouble
      i++
      continue
    }

    if (!inSingle && !inDouble && !inTemplate && ch === "/" && next !== "/" && next !== "*") {
      inRegex = !inRegex
      i++
      continue
    }

    if (!inSingle && !inDouble && !inTemplate && !inRegex && !inLineComment && !inBlockComment) {
      if (ch === "{") depth++
      else if (ch === "}") depth--
    }

    i++
  }

  return text.slice(startIndex, i - 1)
}




function mapFunctionCalls(text, functionNames) {
  const callMap = {}
  const calledBy = {}

  functionNames.forEach(fn => {
    callMap[fn] = new Set()
    calledBy[fn] = new Set()
  })

  functionNames.forEach(fn => {
    const defRegex = new RegExp("function\\s+" + fn + "\\s*\\([^)]*\\)\\s*\\{", "g")
    let lastStart = null
    let match
    while ((match = defRegex.exec(text)) !== null) lastStart = defRegex.lastIndex
    if (lastStart === null) return

    const body = extractFunctionBody(text, lastStart)
    const clean = stripComments(body)

    const callees = scanCallsOutsideStrings(clean, functionNames)
    callees.forEach(other => {
      callMap[fn].add(other)
      calledBy[other].add(fn)
    })
  })

  return { callMap, calledBy }
}





function scanCallsOutsideStrings(code, functionNames) {
  const callees = new Set()
  const nameSet = new Set(functionNames)

  let i = 0
  let inSingle = false
  let inDouble = false
  let inTemplate = false
  let inRegex = false

  while (i < code.length) {
    const ch = code[i]
    const next = code[i + 1]

    if ((inSingle || inDouble || inTemplate || inRegex) && ch === "\\") {
      i += 2
      continue
    }

    if (!inDouble && !inTemplate && !inRegex && ch === "'" ) {
      inSingle = !inSingle
      i++
      continue
    }

    if (!inSingle && !inTemplate && !inRegex && ch === '"') {
      inDouble = !inDouble
      i++
      continue
    }

    if (!inSingle && !inDouble && !inRegex && ch === "`") {
      inTemplate = !inTemplate
      i++
      continue
    }

    if (!inSingle && !inDouble && !inTemplate && ch === "/" && next !== "/" && next !== "*") {
      inRegex = !inRegex
      i++
      continue
    }

    if (!inSingle && !inDouble && !inTemplate && !inRegex) {
      if (/[A-Za-z_$]/.test(ch)) {
        let j = i
        while (j < code.length && /[A-Za-z0-9_$]/.test(code[j])) j++
        const name = code.slice(i, j)
        if (nameSet.has(name)) {
          let k = j
          while (k < code.length && (code[k] === " " || code[k] === "\t")) k++
          if (code[k] === "(") {
            callees.add(name)
          }
        }
        i = j
        continue
      }
    }

    i++
  }

  return callees
}





function findEventTriggered(text, functionNames) {
  const eventTriggered = {}
  functionNames.forEach(fn => eventTriggered[fn] = new Set())

  functionNames.forEach(parent => {
    const defRegex = new RegExp("function\\s+" + parent + "\\s*\\([^)]*\\)\\s*\\{", "g")
    let lastStart = null
    let match
    while ((match = defRegex.exec(text)) !== null) lastStart = defRegex.lastIndex
    if (lastStart === null) return

    const body = extractFunctionBody(text, lastStart)
    const clean = stripComments(body)

    // Extract ALL string literals, including template literals
    const strings = extractStringLiterals(clean)

    strings.forEach(str => {
      const lower = str.toLowerCase()

      functionNames.forEach(fn => {
        const name = fn.toLowerCase()

        // Detect HTML event handlers inside strings
        if (
          lower.includes(name + "(") ||
          lower.includes('onclick="' + name + '(') ||
          lower.includes("onclick='" + name + "(") ||
          lower.includes("onchange=\"" + name + "(") ||
          lower.includes("onchange='" + name + "(")
        ) {
          eventTriggered[fn].add(parent)
        }
      })
    })
  })

  return eventTriggered
}



function extractStringLiterals(code) {
  const strings = []
  let i = 0
  let inSingle = false
  let inDouble = false
  let inTemplate = false
  let current = ""
  let quoteChar = null

  while (i < code.length) {
    const ch = code[i]

    if ((inSingle || inDouble || inTemplate) && ch === "\\") {
      current += code.slice(i, i + 2)
      i += 2
      continue
    }

    if (!inDouble && !inTemplate && ch === "'" ) {
      if (inSingle) {
        inSingle = false
        strings.push(current)
        current = ""
        quoteChar = null
      } else if (!inSingle && !inDouble && !inTemplate) {
        inSingle = true
        quoteChar = "'"
      }
      i++
      continue
    }

    if (!inSingle && !inTemplate && ch === '"') {
      if (inDouble) {
        inDouble = false
        strings.push(current)
        current = ""
        quoteChar = null
      } else if (!inSingle && !inDouble && !inTemplate) {
        inDouble = true
        quoteChar = '"'
      }
      i++
      continue
    }

    if (!inSingle && !inDouble && ch === "`") {
      if (inTemplate) {
        inTemplate = false
        strings.push(current)
        current = ""
        quoteChar = null
      } else if (!inSingle && !inDouble && !inTemplate) {
        inTemplate = true
        quoteChar = "`"
      }
      i++
      continue
    }

    if (inSingle || inDouble || inTemplate) {
      current += ch
      i++
      continue
    }

    i++
  }

  return strings
}




function analyzeText(text) {
  const functionNames = extractFunctionNames(text)
  const { callMap, calledBy } = mapFunctionCalls(text, functionNames)
  const eventTriggered = findEventTriggered(text, functionNames)

  renderResults(functionNames, callMap, calledBy, eventTriggered)
}




function renderResultsX(functionNames, callMap, calledBy, eventTriggered) {
  let html = ""

  // 0. Functions defined
  html += `<details open>
    <summary><b>0. Functions defined in this input (${functionNames.length})</b></summary>`
  functionNames.sort().forEach(fn => {
    const files = functionOrigins[fn] ? [...functionOrigins[fn]].join(", ") : "?"
    html += `<div><code>${fn}</code> <span style="color:#888">${files}</span></div>`
  })
  html += `</details>`


  // 1. Functions and what they call / who calls them
  html += `<details>
    <summary><b>1. Functions and what they call / who calls them</b></summary>`
  functionNames.sort().forEach(fn => {
    html += `<div style="margin-top:8px"><code>${fn}</code><br>`
    html += `<span style="margin-left:20px"><em>calls:</em> ${
      callMap[fn].size ? [...callMap[fn]].join(", ") : "<span style='color:#ccc'>(none)</span>"
    }</span><br>`
    html += `<span style="margin-left:20px"><em>called by:</em> ${
      calledBy[fn].size ? [...calledBy[fn]].join(", ") : "<span style='color:#ccc'>(none)</span>"
    }</span></div>`
  })
  html += `</details>`


  // 2. Functions ending in X or Z
  const xz = functionNames.filter(fn => /[XZ]$/.test(fn))
  html += `<details>
    <summary><b>2. Functions ending in X or Z (${xz.length})</b></summary>`
  xz.forEach(fn => html += `<div><code>${fn}</code></div>`)
  html += `</details>`


  // 3. Functions triggered by HTML events
  const eventFns = functionNames.filter(fn => eventTriggered[fn].size > 0)
  html += `<details>
    <summary><b>3. Functions triggered by HTML events (${eventFns.length})</b></summary>`
  eventFns.forEach(fn => {
    html += `<div><code>${fn}</code> <em>triggered by:</em> ${
      [...eventTriggered[fn]].join(", ")
    }</div>`
  })
  html += `</details>`

  resultsDiv.innerHTML = html
}


function renderResults(functionNames, callMap, calledBy, eventTriggered) {
  let html = ""

  // 1. Functions and what they call / who calls them
  html += `<details open>
    <summary><b>1. Functions and what they call / who calls them (${functionNames.length})</b></summary>`

  functionNames.sort().forEach(fn => {
    const origins = functionOrigins[fn]
      ? [...functionOrigins[fn]].join(", ")
      : "(unknown source)"

    html += `<div style="margin-top:8px">
      <code>${fn}</code>
      <span class="file">${origins}</span><br>

      <div class="calldata">
      <span class="calls"><em>calls:</em> ${
        callMap[fn].size
          ? [...callMap[fn]].join(", ")
          : "<span style='color:#ccc'>(none)</span>"
      }</span><br>

      <span class="calledby"><em>called by:</em> ${
        calledBy[fn].size
          ? [...calledBy[fn]].join(", ")
          : "<span style='color:#ccc'>(none)</span>"
      }</span>
      </div>
    </div>`
  })

  html += `</details>`


  // 2. Functions ending in X or Z
  const xz = functionNames.filter(fn => /[XZ]$/.test(fn))
  html += `<details>
    <summary><b>2. Functions ending in X or Z (${xz.length})</b></summary>`
  xz.forEach(fn => html += `<div><code>${fn}</code></div>`)
  html += `</details>`


  // 3. Functions triggered by HTML events
  const eventFns = functionNames.filter(fn => eventTriggered[fn].size > 0)
  html += `<details>
    <summary><b>3. Functions triggered by HTML events (${eventFns.length})</b></summary>`
  eventFns.forEach(fn => {
    html += `<div class="htmlfunction"><code>${fn}</code> <em>triggered by:</em> ${
      [...eventTriggered[fn]].join(", ")
    }</div>`
  })
  html += `</details>`

  resultsDiv.innerHTML = html
}

</script>



</body>
</html>
